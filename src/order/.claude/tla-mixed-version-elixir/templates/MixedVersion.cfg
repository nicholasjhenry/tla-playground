\* TLC model configuration for MixedVersion.tla
\* Translate the PlusCal first: java -cp tla2tools.jar pcal.trans MixedVersion.tla
\* Run:  java -cp tla2tools.jar tlc2.TLC -deadlock -config MixedVersion.cfg MixedVersion.tla

SPECIFICATION Spec

\* Keep the domain tiny. Two string model values is plenty to surface design
\* bugs; grow only if you have a specific larger scenario in mind.
CONSTANTS
  Values = {"a", "b"}

\* Structural well-formedness of each replica.
INVARIANT Consistent

\* The two versions must observe the same value after a sync.
INVARIANT MergeAgrees

\* NOTE on -deadlock: this skeleton terminates by design, so without the flag TLC
\* reports a benign "deadlock" at the final all-done state (the system going idle,
\* not a bug). The flag above silences it. Drop the flag if you actually want TLC
\* to check for genuine stuck states / liveness.
