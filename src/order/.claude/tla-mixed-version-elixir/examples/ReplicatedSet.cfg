\* TLC model configuration for ReplicatedSet.tla
\* Translate first:  java -cp tla2tools.jar pcal.trans ReplicatedSet.tla
\* Then check:       java -cp tla2tools.jar tlc2.TLC -config ReplicatedSet.cfg ReplicatedSet.tla

SPECIFICATION Spec

\* One element is enough to surface the resurrection bug. Try {"a", "b"} for
\* broader coverage once you've seen it.
CONSTANTS
  Elems = {"a"}

INVARIANT TypeOK
INVARIANT Consistent     \* this one PASSES: each replica stays well-formed
INVARIANT MergeAgrees    \* this one FAILS: the two versions stop agreeing

\* After you apply a fix from the spec footer, MergeAgrees passes and TLC will
\* report a "deadlock" at the terminal (all-done) state. That is just normal
\* termination - add -deadlock to silence it:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -config ReplicatedSet.cfg ReplicatedSet.tla
