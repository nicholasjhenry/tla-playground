procs:
  # OLD node — boots first, registers a receiver, runs the v1 algorithm and
  # edits a price (carrying the qty it doesn't understand).
  node-b-v1:
    shell: ROLE=b iex --name b@127.0.0.1 --cookie tla -S mix

  # NEW node — builds a v2 order with a real qty, migrates it to node B, and
  # checks qty survived the round trip. Retries the connection until B is up.
  node-a-v2:
    shell: ROLE=a iex --name a@127.0.0.1 --cookie tla -S mix
