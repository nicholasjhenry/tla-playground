SPECIFICATION Spec

\* qty of 2 is enough to surface the dropped-quantity bug. A floor of 1 (the
\* "gate the behaviour" fix) makes QtySurvives hold by construction.
CONSTANTS
  MaxQty = 2

INVARIANT TypeOK
INVARIANT Consistent     \* this one PASSES: the item is always a well-formed map
INVARIANT QtySurvives    \* this one FAILS: v1 rebuilds the item, qty drops to 1

\* After you apply a fix from the spec footer, QtySurvives passes and TLC will
\* report a "deadlock" at the terminal (all-done) state. That is just normal
\* termination - add -deadlock to silence it:
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -config OrderItem.cfg OrderItem.tla
